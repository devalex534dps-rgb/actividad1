<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura</title>
    <link rel="stylesheet" href="css/actividad10.css">
</head>

<body>
    <div class="calculadora">
        <h2>Conversor</h2>

        <div class="grupo-input">
            <label for="celsius">Grados Celsius:</label>
            <input type="text" id="celsius" placeholder="Ej. 25">
            <div id="mensaje-error" class="error">Ingresa un número válido.</div>
        </div>

        <button onclick="realizarConversion()">Convertir</button>

        <div class="grupo-input" style="margin-top: 20px;">
            <label for="fahrenheit">Grados Fahrenheit:</label>
            <input type="text" id="fahrenheit" readonly placeholder="Resultado">
        </div>
    </div>
</body>
<script src="js/actividad10.js"></script>
</html>
