<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Tareas</title>
    <link rel="stylesheet" href="css/actividad17.css">

</head>

<body>

    <script src="js/actividad17.js"></script>

</html>
